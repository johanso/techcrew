<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Installed as /etc/fonts/local.conf (read at 51-local.conf, so before 64-wqy-zenhei.conf). The base image's only
  default UI and monospace family is WenQuanYi Zen Hei, which has no bold face: `system-ui` headings and 700-weight
  text rendered regular. These aliases point the platform UI names (system-ui, -apple-system, Segoe UI …) at Inter
  (variable, 100–900) and fontconfig's generic families at families with real bold faces. Chromium's own `sans-serif`
  default (Arial) still lands on Liberation Sans, which has bold. WenQuanYi stays installed for CJK text.
-->
<fontconfig>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Inter Variable</family><family>Inter</family></prefer>
  </alias>
  <alias binding="same">
    <family>ui-sans-serif</family>
    <prefer><family>Inter Variable</family><family>Inter</family></prefer>
  </alias>
  <alias binding="same">
    <family>-apple-system</family>
    <prefer><family>Inter Variable</family><family>Inter</family></prefer>
  </alias>
  <alias binding="same">
    <family>BlinkMacSystemFont</family>
    <prefer><family>Inter Variable</family><family>Inter</family></prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI</family>
    <prefer><family>Inter Variable</family><family>Inter</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter Variable</family><family>Inter</family></prefer>
  </alias>
  <alias>
    <family>sans</family>
    <prefer><family>Inter Variable</family><family>Inter</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
</fontconfig>
